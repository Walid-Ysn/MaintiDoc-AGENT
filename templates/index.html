<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaintiDoc — Assistant IA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/styles/default.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script defer src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<main class="mx-auto flex min-h-screen max-w-4xl flex-col px-4 py-6">
  <header class="mb-5 flex flex-wrap items-center justify-between gap-3">
    <div><h1 class="text-2xl font-bold">MaintiDoc</h1><p class="text-sm text-slate-500">Assistant intelligent — vos conversations sont enregistrées localement.</p></div>
    <div class="flex flex-wrap gap-2">
      <label class="sr-only" for="specialty">Spécialité</label>
      <select id="specialty" class="rounded-lg border border-slate-300 bg-white px-3 py-2" aria-label="Choisir une spécialité">
        {% for key, prompt in specialties.items() %}<option value="{{ key }}">{% if key == 'maintenance' %}Maintenance{% elif key == 'education' %}Éducation{% elif key == 'medical' %}Santé{% else %}Programmation{% endif %}</option>{% endfor %}
      </select>
      <button id="export-button" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 hover:bg-slate-100">Exporter</button>
      <button id="clear-button" type="button" class="rounded-lg bg-red-600 px-3 py-2 text-white hover:bg-red-700">Effacer</button>
    </div>
  </header>
  <div id="notice" class="mb-3 hidden rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm" role="status"></div>
  <div id="chat-template" class="mb-3 hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"><div class="message break-words leading-relaxed"></div></div>
  <section id="gpt-output" class="flex-1 space-y-3" aria-live="polite" aria-label="Conversation"></section>
  <form id="prompt-form" class="sticky bottom-0 mt-5 space-y-3 rounded-xl bg-slate-50 py-3">
    <div class="flex gap-2"><label class="sr-only" for="file-input">Fichier à résumer</label><input id="file-input" type="file" accept=".txt,.md,.pdf,.docx" class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white p-2 text-sm"><button id="summarize-button" type="button" class="rounded-lg border border-indigo-300 bg-white px-3 py-2 text-indigo-700 hover:bg-indigo-50">Insérer / résumer</button></div>
    <div class="flex gap-2"><label class="sr-only" for="prompt">Votre message</label><input id="prompt" name="prompt" type="text" required placeholder="Posez votre question…" class="min-w-0 flex-1 rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none focus:border-indigo-500"><button type="submit" class="rounded-xl bg-indigo-600 px-5 py-3 font-medium text-white hover:bg-indigo-700 disabled:opacity-50">Envoyer</button></div>
    <p class="text-xs text-slate-500">Formats pris en charge : TXT, MD, PDF et DOCX. Taille maximale : 10 Mo. Les fichiers sont traités sans être conservés.</p>
  </form>
</main>
</body>
</html>
